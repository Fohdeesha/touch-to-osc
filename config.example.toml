# touch-to-osc configuration
#
# Every key below shows its default, except the [[device]] block's id and match_usb,
# which are for one QDtech MPI1168 screen. Unknown keys, wrong types and
# out-of-range values are refused at start with a message that names the key.
# Check a file without starting anything: sudo touch-to-osc --check-config=FILE
# Find your screens and a block ready to paste for each: sudo touch-to-osc --list

[osc]
# Commands and subscriptions arrive here (UDP). Touches and status go out from other ports,
# so a receiver behind a firewall must let in UDP from this machine to its own port.
listen = "0.0.0.0:9480"
# Every address the daemon sends or answers starts with this.
prefix = "/touch"
# Hosts that may subscribe and send commands. Anything else gets an error that says so.
# An empty list is refused unless open_to_any is set. Add each machine that runs a
# receiver. Hosts added or removed over OSC are kept as changes on top of this list,
# so a host added here later is never hidden by them.
allowed_ips = ["127.0.0.1"]
open_to_any = false

[log]
# crit, error, warning, notice, info or debug. debug adds a line for every command and
# lease renewal. Touches are never logged.
level = "info"

[paths]
# Settings changed over OSC are saved here and win over
# this file, until this file's own value for one of them is changed: then this file's
# new value applies from the next start. This file is never written. "" keeps such
# changes only until a restart. The status lists which settings come from there
# (/touch/overrides), and <prefix>/settings/forget puts them back to what this file says.
# The service can only write under /var/lib/touch-to-osc: keep both paths there.
settings = "/var/lib/touch-to-osc/settings.toml"
# What touch-to-osc keeps between runs: the USB port each screen was last read on (for USB
# recovery after a restart), a copy of the last config file that started (it runs on that
# copy, with a warning, when this file is refused at a start) and a note while a USB reset
# runs. Not settings; "" keeps nothing.
state = "/var/lib/touch-to-osc/state.toml"

# Receivers that always get touches and status, without subscribing. None by default:
# a receiver normally subscribes (see the README). Copy this block for each one.
#
# [[destination]]
# address = "192.168.1.27:9481"
# # Each touch as it happens. The alive and the list of active contacts go to every
# # destination either way, because a receiver needs them to end touches it missed.
# touches = true
# # The status, the events and the counters.
# status = true
# # No 64-bit arguments, for receivers whose OSC library takes only i, f and s: touches
# # without their time stamp, counts as i.
# plain = false

# One block per touchscreen. sudo touch-to-osc --list shows every touchscreen with its usb
# id, serial and port, which block here reads it, and a block to paste for any that none
# reads.
[[device]]
# A short name: a-z, 0-9, _ and -. Touches arrive as <prefix>/<id>/down and so on.
# Required. device, devices, status, settings, describe, allowed_ips and
# saved_destinations are taken by touch-to-osc's own addresses.
id = "screen"
# What people call it, used in health messages. Defaults to the id.
label = ""
# Which screen to read: its usb vendor:product in hex, its serial (as --list prints it),
# its USB port path such as "3-3" (the kernel's name for the socket it is plugged into),
# or several of them; every one given must match. Set at least match_usb or match_port.
# With two identical screens, set match_port (or match_serial, if theirs differ) for each:
# otherwise they are shared out in USB port order, which a change of sockets changes.
# The older names usb, serial and port still work.
match_usb = "0712:0009"
match_serial = ""
match_port = ""
# Hold the device exclusively, so nothing else on the machine (the console) acts on
# the touches, and no other program can take it away. With false, another program that
# takes it exclusively is only noticed when silence_ms is on.
grab = true
# Turns touch positions clockwise by 0, 90, 180 or 270 degrees to match the display:
# with 90, a touch at the panel's top left lands at the display's top right. Then
# mirror flips the result: "x" left-right, "y" top-bottom, "xy" both. Check with a
# finger on each corner while touch-to-osc-watch runs (see "Lining up" in the README).
rotation = 0
mirror = ""
# Width / height of the screen's display area, sent in the status so receivers can keep
# circles round. 0 takes it from the device's size (and rotation); a screen that does
# not report its size gets a guess from its units, which the journal says, so set it
# then (1.778 for a 16:9 display).
aspect = 0
# An optional fine correction applied after rotation and mirror, as six numbers
# [a, b, c, d, e, f]: x' = a*x + b*y + c, y' = d*x + e*y + f, on 0..1 positions, each
# between -100 and 100. [1, 0, 0, 0, 1, 0] changes nothing. It lines the touch panel up
# with the display; never use it for a picture scaled or letterboxed on the display (the
# receiver works that out). [] for none. The README shows how to work the numbers out.
calibration = []
# Cancel the contacts that are down when the device sends nothing for this long, in
# milliseconds. Screens like this one report every 16-24 ms while a finger is down,
# even a still one, so silence means the screen or its cable has failed; without this,
# a held contact would stay down until the kernel notices (3.7 s when a USB extender
# was pulled). 0 turns it off: needed for a screen that only reports changes, or still
# fingers are cancelled after this long (the journal says so when it sees it).
# Otherwise 50-10000.
silence_ms = 200
# false starts with the device turned off (a command can turn it on). A device turned
# off here does not count against the health.
enabled = true
# While this screen is gone, watch the USB port it was last on (or match_port, above):
# when something is plugged in there that the kernel has given up on for 10 s, reset the
# USB hub of that port so the kernel tries again. On a port of the computer itself that
# drops every device on that USB bus for a moment (sudo touch-to-osc --list names them).
# See "USB recovery" in the README.
usb_recovery = true
